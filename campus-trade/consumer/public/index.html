<!DOCTYPE html>
<html lang="en">
<head>

<title>Campus Trade – Consumer</title>
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
<div class="phone">
  <header>
    <div class="top">

  <div class="sheet" id="sheet"><button class="back" id="back">‹ Back</button><div class="body" id="sbody"></div></div>
  <div class="toast" id="toast"></div>

<script src="/config.js"></script>

</html>
